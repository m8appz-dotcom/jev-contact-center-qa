name: JEV QA offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Generate the authored sample report
        run: python tools/create_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: jev-demo-${{ matrix.os }}-${{ matrix.python }}
          path: docs/examples
